name: Sync Luma Events

on:
  workflow_dispatch:
  schedule:
    - cron: "10 */6 * * *"

permissions:
  contents: write

concurrency:
  group: luma-events-sync
  cancel-in-progress: false

jobs:
  sync-events:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Sync events from public Luma page
        env:
          LUMA_CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          LUMA_ALLOW_NOOP_ON_FAILURE: "1"
        run: npm run sync:events

      - name: Commit updated generated events
        run: |
          if git diff --quiet -- src/content/events.luma.generated.json; then
            echo "No event updates found."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/events.luma.generated.json
          git commit -m "chore: sync Luma events"
          git push origin HEAD:${{ github.ref_name }}
